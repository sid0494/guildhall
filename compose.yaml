# Local infrastructure for development (docs/adr/0012), and the bot itself
# under the "app" profile (docs/adr/0026).
#
#   docker compose up -d --wait                  infrastructure only
#   docker compose --profile app up -d --build   also migrate, create queues and bucket, run the worker
#
# Compose reads .env to fill in ${...} below (see .env.example). Third-party
# images are pinned by tag and digest; Dependabot keeps them current.
name: guildhall

# Shared by every service that runs the Guildhall image. `x-` keys are ignored
# by compose; the anchor (&) is merged into each service with `<<: *guildhall`.
x-guildhall: &guildhall
  build: .
  image: guildhall:dev
  profiles: [app]
  env_file:
    - path: .env
      required: false # CI has no .env; it sets variables directly
  environment:
    # The same password the postgres service gets, also when there is no .env.
    GUILDHALL_POSTGRES_PASSWORD: ${GUILDHALL_POSTGRES_PASSWORD:?set GUILDHALL_POSTGRES_PASSWORD in .env}
    # Inside the compose network, services are reached by name, not 127.0.0.1.
    GUILDHALL_POSTGRES_HOST: postgres
    GUILDHALL_POSTGRES_PORT: "5432"
    GUILDHALL_AWS_ENDPOINT_URL: http://moto:5000

services:
  migrate:
    <<: *guildhall
    # One-shot: bring the schema up to date, then exit.
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  aws-setup:
    <<: *guildhall
    # One-shot: create the job queues and the archive bucket on moto.
    command: ["python", "-m", "guildhall.platform.dev_aws"]
    depends_on:
      moto:
        condition: service_healthy

  worker:
    <<: *guildhall
    depends_on:
      migrate:
        condition: service_completed_successfully
      aws-setup:
        condition: service_completed_successfully
    # Above drain (35 s) plus outbox flush (5 s), so SIGKILL never cuts a drain
    # short (docs/adr/0023).
    stop_grace_period: 45s

  postgres:
    image: postgres:18.6-trixie@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    environment:
      POSTGRES_USER: guildhall
      POSTGRES_DB: guildhall
      POSTGRES_PASSWORD: ${GUILDHALL_POSTGRES_PASSWORD:?set GUILDHALL_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=guildhall --dbname=guildhall"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10.3-trixie@sha256:1f88291b4c57bdf249f02eb085a8669889b2d2954e91d4de5118a5da6b78dd53
    # Rate-limit buckets rebuild themselves, so nothing is written to disk.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  moto:
    # Open-source emulator for the AWS APIs the platform uses: SQS and S3.
    image: motoserver/moto:5.2.5@sha256:59a1965d845249b04def37a0e2565f9cc6c44543cb89b68e90f28f344b3b0d1a
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:5000/moto-api/"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
