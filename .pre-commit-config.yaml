# Hooks that run on every commit. CI runs the same checks.
# Python tools run through uv so their versions come from uv.lock (docs/adr/0005).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: uv-lock
        name: uv.lock matches pyproject.toml
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format
        language: system
        types_or: [python, pyi, markdown]

      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check
        language: system
        types_or: [python, pyi]

      - id: mypy
        name: mypy
        entry: uv run --locked mypy
        language: system
        types_or: [python, pyi, toml]
        pass_filenames: false

      - id: pytest
        name: pytest (unit and contract; integration runs in CI)
        entry: uv run --locked pytest -m "not integration"
        language: system
        types_or: [python, toml]
        pass_filenames: false
