# Redis holds the per-plug-in rate-limit buckets, on both clusters
# (docs/adr/0078). They rebuild themselves, so nothing is written to disk and
# a Deployment, whose pods are interchangeable, is enough. Same image and
# flags as compose.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: guildhall
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: guildhall
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: guildhall
    spec:
      # Don't inject an environment variable per Service (REDIS_PORT=tcp://...).
      enableServiceLinks: false
      containers:
        - name: redis
          image: redis:8.10.3-trixie@sha256:1f88291b4c57bdf249f02eb085a8669889b2d2954e91d4de5118a5da6b78dd53
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: guildhall
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: guildhall
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
