# Runs on every pull request and every push to main (docs/adr/0006).
# Third-party actions are pinned to commit SHAs; the comment names the release.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, type check and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"

      - name: Install dependencies from the lockfile
        run: uv sync --locked

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run all pre-commit hooks
        run: uv run --locked pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: gitleaks # the secret-scan job scans the full history instead

  integration:
    name: Integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # moto accepts any credentials; these reach only the emulator in this job.
      GUILDHALL_AWS_ENDPOINT_URL: http://127.0.0.1:5000
      GUILDHALL_AWS_ACCESS_KEY_ID: moto-ci
      GUILDHALL_AWS_SECRET_ACCESS_KEY: moto-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"

      - name: Generate a throwaway database password
        run: |
          password="$(openssl rand -hex 16)"
          echo "::add-mask::${password}"
          echo "GUILDHALL_POSTGRES_PASSWORD=${password}" >> "$GITHUB_ENV"

      - name: Start the compose services
        run: docker compose up -d --wait postgres moto

      - name: Build the image
        run: docker compose --profile app build

      - name: Install dependencies from the lockfile
        run: uv sync --locked

      - name: Run integration tests
        run: uv run --locked pytest -m integration

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs

  secret-scan:
    name: Secret scan (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: "8.30.1" # keep in step with .pre-commit-config.yaml
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan every commit
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose .'
