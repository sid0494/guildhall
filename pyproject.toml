[project]
name = "guildhall"
version = "0.1.0"
description = "Discord bot that hosts game-data plug-ins on a shared platform"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiobotocore>=3.10.0",
    "alembic>=1.20.1",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.8",
    "structlog>=26.1.0",
]

[project.scripts]
guildhall-worker = "guildhall.bootstrap:worker_main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle: errors and warnings
    "F",       # pyflakes: unused imports, undefined names
    "I",       # isort: import order
    "B",       # flake8-bugbear: likely bugs and design problems
    "UP",      # pyupgrade: syntax for the targeted Python version
    "SIM",     # flake8-simplify: needlessly complex code
    "N",       # pep8-naming: naming conventions
    "S",       # flake8-bandit: security smells
    "ASYNC",   # flake8-async: blocking calls inside async code
    "DTZ",     # flake8-datetimez: naive datetimes (all timestamps are UTC)
    "PT",      # flake8-pytest-style: consistent pytest usage
    "RUF",     # ruff-specific checks
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # pytest's assert statements are how tests check results

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "migrations"]
warn_unreachable = true
enable_error_code = ["ignore-without-code"]
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "--import-mode=importlib", "-ra"]
xfail_strict = true
markers = ["integration: needs the compose services (docker compose up -d --wait)"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
    "types-aiobotocore[sqs]>=3.10.0",
]

[tool.alembic]
script_location = "%(here)s/migrations"
file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s"
